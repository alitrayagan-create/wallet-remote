; Wallet Remote firmware for ESP32-2432S028 (Cheap Yellow Display)
; Arduino sketch: arduino/WalletRemote/WalletRemote.ino
; Password wallet + Windows BLE macro pad, stored on microSD.
;
; Board variant note:
;   Single micro-USB units = ILI9341 (uncomment that line, comment ST7789).
;   "7789" clone / USB-C v3 units = ST7789 (currently active).

[platformio]
src_dir = arduino/WalletRemote

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 40000000L
lib_ignore = ESP32 BLE Keyboard

build_flags =
	-D LV_CONF_INCLUDE_SIMPLE=1
	-I arduino/WalletRemote
	; ---------- TFT_eSPI: CYD (ESP32-2432S028) ----------
	-D USER_SETUP_LOADED=1
	; --- ILI9341 variant (single micro-USB): uncomment the next line instead ---
	; -D ILI9341_DRIVER=1
	; --- ST7789 clone variant (currently active) ---
	-D ST7789_DRIVER=1
	-D TFT_INVERSION_ON=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	; NOTE: TFT_BL is intentionally NOT defined here. We drive GPIO21 (backlight)
	; manually so the panel stays dark until the first frame is drawn (no boot flash).
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D USE_HSPI_PORT=1
	; ---------- BLE keyboard uses the lighter NimBLE stack ----------
	-D USE_NIMBLE=1

lib_deps =
	lvgl/lvgl@^8.3.11
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^6.21.5
	h2zero/NimBLE-Arduino@^1.4.2
